.connect-intro:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#101010 0%,#101010f5 24%,#10101075 49%,transparent 76%)}
.connect-intro-copy{max-width:620px;animation:connect-copy .9s ease-out both}
.connect-intro .intro-kicker{color:#e1c88e;font-size:14px;letter-spacing:.2em;margin-bottom:25px}
.connect-intro h1{font-size:clamp(30px,3.4vw,52px);line-height:1.6;letter-spacing:.07em;margin:0 0 22px;color:white;font-weight:500}
.connect-intro p{font-size:16px;color:#f1ede4;line-height:2;margin:0 0 26px}
.connect-intro .primary{background:#dfc78f;color:#17140e;border:1px solid #dfc78f;padding:13px 24px}
.connect-intro .primary:hover{background:#f1deb2}
.home-topline{display:none!important}
@keyframes connect-image{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:scale(1)}}
@keyframes connect-copy{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:900px){.connect-intro{min-height:600px;align-items:flex-end;margin:0 0 25px;padding:290px 22px 28px}.connect-intro img{width:100%;height:370px;object-fit:contain;object-position:center top}.connect-intro:before{background:linear-gradient(0deg,#101010 0%,#101010 22%,#10101090 43%,transparent 70%)}.connect-intro h1{font-size:30px;line-height:1.5}.connect-intro .intro-kicker{margin-bottom:12px}.connect-intro p{font-size:15px;margin-bottom:18px}}

function allAwardEvents(){return [...notes.filter(n=>n.id&&n.authorId&&n.createdAt).map(n=>({id:'post-'+n.id,type:'post',noteId:n.id,actor:n.authorId,date:n.createdAt})),...awardSeedEvents,...awardExtra]}
function awardLedger(personId){const counts={},seen=new Set();return allAwardEvents().sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id)).flatMap(e=>{const n=notes.find(n=>n.id===e.noteId),rule=awardRules[e.type];if(!n||n.authorId!==personId||!rule||!people.some(p=>p.id===e.actor)||!/^\d{4}-\d{2}-\d{2}$/.test(e.date))return [];if(e.type!=='post'&&e.actor===personId)return [];const key=e.type+'|'+e.noteId+'|'+(e.type==='help'?e.actor:e.type==='use'?normalizeCase(e.caseName||''):'');if(seen.has(key))return [];seen.add(key);const month=e.date.slice(0,7),bucket=month+e.type;counts[bucket]=(counts[bucket]||0)+1;const points=counts[bucket]<=rule.cap?rule.points:0;if(awardPeriod!=='all'&&month!==awardPeriod)return [];return [{...e,n,points,capped:!points}]})}
function awardRows(){const rows=people.filter(p=>awardDept==='すべて'||p.dept===awardDept).map(p=>{const events=awardLedger(p.id);return {p,events,total:events.reduce((s,e)=>s+e.points,0),counts:Object.fromEntries(Object.keys(awardRules).map(k=>[k,events.filter(e=>e.type===k&&e.points>0).length]))}}).sort((a,b)=>b.total-a.total||a.p.id-b.p.id);rows.forEach((r,i)=>r.rank=i&&rows[i-1].total===r.total?rows[i-1].rank:i+1);return rows}

{r.total?r.rank+' 位':'—'}</td><td><b>${r.p.name}</b><br><span class="role">${r.p.dept}</span></td><td>${r.counts.post} 件</td><td>${r.counts.help} 件</td><td>${r.counts.use} 件</td><td><b>${r.total} pt</b><div class="scorebar"><span style="width:${rows[0]?.total?r.total/rows[0].total*100:0}%"></span></div></td><td><button class="link" onclick="showContribution(${r.p.id})">内訳 ↗</button></td></tr>`).join('')}</tbody></table><p class="notice">件数は加点対象分。全期間では各月の上限を適用した得点を合算します。</p></div><details class="panel awardrules"><summary>ポイントの計算方法・集計ルール</summary><p>貢献ポイント ＝ 共有件数 × 10 ＋「役立った」件数 × 3 ＋ 案件活用件数 × 20</p><ul><li>知見の共有：社員1人につき月5件まで加点。</li><li>役立った：他の社員からの反応。1知見につき同じ社員は1回、受け取る加点は月20件まで。</li><li>案件活用：活用先と内容を記録。1知見・1案件につき1回、受け取る加点は月5件まで。</li><li>自己反応・自己活用は対象外。共有は投稿日、反応・活用は登録日の月に加点します。</li><li>日付・社員IDのない旧投稿は集計対象外。労力の全量ではなく、アプリ内に記録された共有への貢献を示します。</li></ul><p class="muted">配点は試作の提案値です。表彰は現在の集計による暫定結果です。</p></details><div class="banner"><span>知見を投稿すると共有ポイントに反映。知見詳細から「役立った」や活用実績を登録できます。</span><button class="link" onclick="go('knowledge')">ナレッジを見る →</button></div><p class="notice">デモでは操作する社員を選択できます。本番運用ではログインした社員のIDと、案件活用の確認フローに接続します。</p>`}

function landCard(x){const i=lands.indexOf(x);return `<article class="card">${landBadge(x)}<h3 style="margin:12px 0">${esc(x.name)}</h3><div class="role">${esc(x.address)}</div><div class="landprice">${landPrice(x)}</div><div class="role">${esc(x.priceType)} · 土地全体の総額</div><p>所有者：${esc(landOwnerName(x))}<br><span class="role">${x.ownerKind==='company'?'法人保有／窓口：'+esc(landClient(x)?.name||'未登録'):'個人保有'} · 所有権確認：${esc(x.ownerCheck)}</span></p><div class="cardfoot"><button class="link" onclick="focusLand(${i})">地図で見る ↗</button><button class="link" onclick="showLand(${i})">詳細・人脈を見る ↗</button></div></article>`}
function renderLand(){const rows=landRows();app.innerHTML+=searchBox()+`<div class="sectionhead"><div><h2>非公開土地情報・売却可能性マップ</h2><div class="role">取引先との人脈から得た非公開土地情報と、売却検討の可能性・価格を確認</div></div><button class="primary" onclick="editLand()">＋ 土地を登録</button></div><div class="awardcontrols"><label>売却検討可能性 <select onchange="landStatus=this.value;render()"><option value="all">すべて</option>${Object.keys(landStatuses).map(s=>`<option ${s===landStatus?'selected':''}>${s}</option>`).join('')}</select></label><label>クライアント <select onchange="landOwner=this.value;render()"><option value="all">すべて</option>${clients.map(c=>`<option value="${esc(c.id)}" ${c.id===landOwner?'selected':''}>${esc(c.name)} / ${esc(c.company)}</option>`).join('')}</select></label><label>価格上限（万円） <input class="landmax" type="number" min="0" value="${esc(landMax)}" onchange="landMax=this.value;render()" placeholder="指定なし"></label><button class="secondary" onclick="landStatus='all';landOwner='all';landMax='';query='';render()">条件を解除</button></div><div class="landlegend">${Object.keys(landStatuses).map(s=>landBadge({status:s})).join('')}<span>${rows.length} 件</span></div><div id="land-map" aria-label="非公開土地情報・売却可能性の日本地図"><p class="maploading">日本地図を読み込み中…</p></div><p id="mapstatus" class="notice" role="status">内蔵の日本地図を表示しています。ピンを選ぶと価格・所有者・人脈が開きます。</p><p class="notice">サンプルはすべて架空。ピンは都市周辺の概略位置で、実在の保有地・筆界を示しません。価格は土地全体の総額（万円）、売却意向は記録時点の申告です。価格上限を指定すると価格未確認の土地は除外されます。</p>${landError?`<p role="alert">${esc(landError)}</p>`:''}<div class="grid">${rows.map(landCard).join('')}</div>${rows.length?'':empty()}`;renderOfflineMap(rows)}
function loadLeaflet(){if(typeof window==='undefined')return Promise.reject(Error('no browser'));if(window.L)return Promise.resolve(window.L);if(leafletLoad)return leafletLoad;leafletLoad=new Promise((resolve,reject)=>{const css=document.createElement('link');css.rel='stylesheet';css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';css.integrity='sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=';css.crossOrigin='';document.head.appendChild(css);const js=document.createElement('script');js.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';js.integrity='sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=';js.crossOrigin='';js.onload=()=>resolve(window.L);js.onerror=()=>{leafletLoad=null;reject(Error('load'))};document.head.appendChild(js)});return leafletLoad}
async function initLandMap(rows){const container=document.getElementById('land-map');try{const L=await loadLeaflet();if(page!=='land'||document.getElementById('land-map')!==container)return;container.innerHTML='';landMap=L.map(container,{scrollWheelZoom:false}).fitBounds([[25,127],[46,146]]);landMarkers={};const tiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>'}).addTo(landMap);tiles.on('tileerror',()=>{if(page==='land')document.getElementById('mapstatus').textContent='背景地図の一部を取得できません。土地情報は下の一覧でも確認できます。'});rows.forEach(x=>{const i=lands.indexOf(x);const icon=L.divIcon({className:'landpinwrap',html:`<span class="landpin" style="background:${landStatuses[x.status]}"></span>`,iconSize:[24,34],iconAnchor:[12,34]});const marker=L.marker([x.lat,x.lng],{icon,title:x.name,alt:x.name,keyboard:true}).addTo(landMap);marker.bindTooltip(`${esc(x.status)} · ${landPrice(x)}`,{permanent:true,direction:'right',className:'landtooltip'});marker.bindPopup(`<div class="landpopup"><b>${esc(x.name)}</b><p>${esc(x.status)}<br><strong>${landPrice(x)}</strong><br>${esc(x.priceType)}</p><p>所有者：${esc(landOwnerName(x))}<br>所有権確認：${esc(x.ownerCheck)}</p><button onclick="showLand(${i})">詳細・人脈を見る →</button></div>`);landMarkers[x.id]=marker})}catch{if(page==='land'&&document.getElementById('land-map')===container){container.innerHTML='<div class="empty">地図を読み込めませんでした。<br>ネット接続を確認し、ページを再表示してください。<br>土地・所有者・価格は下の一覧から確認できます。</div>'}}}
function focusLand(i){const x=lands[i];if(landMap&&landMarkers[x.id]){landMap.setView([x.lat,x.lng],11);landMarkers[x.id].openPopup();document.getElementById('land-map').scrollIntoView({behavior:'smooth',block:'center'})}else showLand(i)}
function showLand(i){const x=lands[i],c=landClient(x);openModal(`<div class="eyebrow">LAND / 所有者に紐づく土地情報</div><h1>${esc(x.name)}</h1>${landBadge(x)}<div class="landprice">${landPrice(x)}</div><div class="role">${esc(x.priceType)} / 土地全体の総額・成約価格ではありません</div><div class="clientfields">${[['所在地',x.address],['面積',x.size?Number(x.size).toLocaleString()+' ㎡':'未確認'],['所有者',landOwnerName(x)],['所有者の種別',x.ownerKind==='company'?'法人（クライアントの所属会社）':'個人（クライアント本人）'],['所有権の確認状況',x.ownerCheck],['情報源',x.source],['意向・価格の確認日',x.checked],['社内担当',clientName(x.staff)],['位置情報',x.lat+', '+x.lng]].map(([k,v])=>clientField(k,v)).join('')}</div><p>${esc(x.memo||'')}</p><h3>所有者につながる人脈</h3>${c?`<p><button class="link" onclick="showClient(${clients.indexOf(c)})">${esc(c.name)} / ${esc(c.company)} のクライアント情報 ↗</button></p>${c.relations.map(r=>`<div class="row"><button class="link" onclick="showPerson(${r.personId})">${esc(clientName(r.personId))}</button> · ${esc(r.level)}<br>${esc(r.evidence)}</div>`).join('')}`:'<p>クライアントの紐づけを確認してください。</p>'}<button class="secondary" style="margin-top:24px" onclick="editLand(${i})">土地情報を編集</button>`)}
function landSelect(name,label,options,value){return `<label class="field">${label}<select name="${name}">${options.map(([v,t])=>`<option value="${esc(v)}" ${String(value)===String(v)?'selected':''}>${esc(t)}</option>`).join('')}</select></label>`}
function editLand(i=-1,ownerId=''){const x=lands[i]||{ownerId,ownerKind:'company',status:'未確認',priceType:'未確認',ownerCheck:'未確認'};openModal(`<div class="eyebrow">LAND REGISTER</div><h1>${i<0?'土地を登録':'土地情報を編集'}</h1><form id="landform">${formField('name','土地名',x.name||'',true)}${formField('address','所在地・地番',x.address||'',true)}<div class="clientfields">${formField('lat','緯度（例：35.68）',x.lat??'',true)}${formField('lng','経度（例：139.76）',x.lng??'',true)}</div><p class="notice">所在地だけではピン位置は決まりません。確認済みの緯度・経度を入力してください。地図は筆界を表しません。</p>${formField('size','面積（㎡）',x.size??'')}${landSelect('ownerId','紐づくクライアント',clients.map(c=>[c.id,c.name+' / '+c.company]),x.ownerId)}${landSelect('ownerKind','実際の所有者', [['company','選択クライアントの所属会社（法人）'],['person','選択クライアント本人（個人）']],x.ownerKind)}<p class="notice">紹介者・仲介担当者を所有者として登録しないでください。別の所有者は先にクライアント欄へ登録します。</p>${landSelect('ownerCheck','所有権確認', ['未確認','本人申告','登記資料確認済み'].map(s=>[s,s]),x.ownerCheck)}${landSelect('status','売却検討可能性',Object.keys(landStatuses).map(s=>[s,s]),x.status)}${formField('price','検討売却価格（万円・総額／未確認は空欄）',x.price??'')}${landSelect('priceType','価格の根拠',['未確認','所有者希望額','社内検討額','交渉中の提示額'].map(s=>[s,s]),x.priceType)}${formField('source','情報源・所有権確認資料',x.source||'',true)}${formField('checked','意向・価格の確認日',x.checked||'',true,false,'date')}${landSelect('staff','社内担当者',people.map(p=>[p.id,p.name]),x.staff)}${formField('memo','条件・備考',x.memo||'',false,true)}<div id="landerror" role="alert"></div><button class="primary">保存する</button> <button type="button" class="secondary" onclick="modal.close()">キャンセル</button></form>`);document.getElementById('landform').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),next={...x,id:x.id||'land-'+Date.now()};['name','address','ownerId','ownerKind','ownerCheck','status','priceType','source','checked','memo'].forEach(k=>next[k]=String(f.get(k)||'').trim());next.lat=Number(f.get('lat'));next.lng=Number(f.get('lng'));next.size=String(f.get('size')||'').trim()===''?null:Number(f.get('size'));next.price=String(f.get('price')||'').trim()===''?null:Number(f.get('price'));next.staff=Number(f.get('staff'));const error=validateLand(next);if(error){document.getElementById('landerror').textContent=error;return}const updated=[...lands];if(i<0)updated.push(next);else updated[i]=next;if(landError){document.getElementById('landerror').textContent=landError;return}try{localStorage.setItem('kasumi-lands-v1',JSON.stringify(updated))}catch{document.getElementById('landerror').textContent='保存できませんでした。入力内容を保持しています。';return}lands=updated;modal.close();render();showLand(i<0?lands.length-1:i);toast('土地と所有者の紐づけを保存しました')}}
function validateLand(x){if(!x.name||!x.address||!x.source||!x.checked)return '土地名・所在地・情報源・確認日を入力してください。';if(!Number.isFinite(x.lat)||!Number.isFinite(x.lng)||x.lat<20||x.lat>46||x.lng<122||x.lng>154)return '日本周辺の緯度（20〜46）・経度（122〜154）を入力してください。';if(!landClient(x)||!['person','company'].includes(x.ownerKind)||!clientPerson(x.staff))return '所有者と社内担当の紐づけを確認してください。';if(x.ownerKind==='company'&&!landClient(x).company)return '法人保有の場合はクライアントの会社名を登録してください。';if(x.price!==null&&(!Number.isFinite(x.price)||x.price<=0))return '価格は正の数値で入力してください。未確認は空欄にします。';if(x.size!==null&&(!Number.isFinite(x.size)||x.size<=0))return '面積は正の数値で入力してください。';if((x.price===null)!==(x.priceType==='未確認'))return '価格未確認の場合は価格を空欄にし、価格の根拠も未確認にしてください。';if(!Object.hasOwn(landStatuses,x.status))return '売却検討可能性を選択してください。';return ''}
const landOriginalShowClient=showClient;showClient=function(i){landOriginalShowClient(i);const c=clients[i],owned=lands.filter(x=>x.ownerId===c.id);modal.innerHTML+=`<div class="sectionhead"><h3>非公開土地情報・売却可能性のある土地</h3><button class="link" onclick="editLand(-1,clients[${i}].id)">＋ 土地を登録</button></div><p class="role">法人保有と個人保有を分けて表示します。所有権の確認状況は各土地の詳細で確認できます。</p>${owned.map(x=>`<div class="row">${landBadge(x)}<br><button class="link" onclick="showLand(${lands.indexOf(x)})">${esc(x.name)} ↗</button><br>${landPrice(x)} / ${esc(x.priceType)}<br>所有者：${esc(landOwnerName(x))}</div>`).join('')||'<p>紐づく土地は未登録です。</p>'}<button class="secondary" style="margin-top:20px" onclick="modal.close();landOwner=clients[${i}].id;landStatus='all';landMax='';go('land')">このクライアントの土地を地図で見る</button>`};

function showProject(i){const p=projects[i];openModal(`<div class="eyebrow">PROJECT / 架空の社内デモ</div><h1>${esc(p.name)}</h1><p>${esc(p.division)}事業部 / ${esc(p.department)}<br>${esc(p.period)} / 更新 ${esc(p.updated)}</p><h3>事業計画・現在地</h3><p>${esc(p.plan)}</p><p>${p.done}/${p.total}工程完了 · ${pct(p.done,p.total)}</p>${progressBar(p.done,p.total)}<p>定性的な進捗：${esc(p.qualitative)}<br>根拠：${esc(p.evidence)}</p><div class="stats">${metric('売上高',p.revenueActual,p.revenuePlan)}${metric('営業利益',p.profitActual,p.profitPlan)}</div><p>営業利益率：実績 ${pct(p.profitActual,p.revenueActual)} / 計画 ${pct(p.profitPlan,p.revenuePlan)}</p><h3>携わるメンバー</h3><p>${p.members.map(id=>`<button class="link" onclick="showPerson(${id})">${esc(clientName(id))} ↗</button>`).join(' / ')}</p><h3>取引先</h3><p>${p.clientIds.map(id=>{const j=clients.findIndex(c=>c.id===id);return j<0?'未登録':`<button class="link" onclick="showClient(${j})">${esc(clients[j].name)} / ${esc(clients[j].company)} ↗</button>`}).join('<br>')}</p><h3>現状の課題</h3><p>${esc(p.issue||'未登録')}</p><h3>他事業部へのHELP</h3><p>${esc(p.helpTo)} / ${esc(p.helpStatus)} / 期限 ${esc(p.deadline)}<br>${esc(p.help||'なし')}</p><div class="badge">戦略との対応（デモ上の分類）：${esc(p.theme)}</div><p><button class="secondary" onclick="editProject(${i})">計画・進捗を更新</button></p>`)}
function editProject(i=-1){const p=projects[i]||{division:'ホテル',department:'開発部',members:[],clientIds:[],total:5,done:0};openModal(`<h1>企画の${i<0?'登録':'更新'}</h1><form id="projectform">${formField('name','企画名',p.name||'',true)}${landSelect('division','事業部',Object.keys(divisions).map(x=>[x,x]),p.division)}${landSelect('department','部署',[...new Set(Object.values(divisions).flat())].map(x=>[x,x]),p.department)}${formField('period','計画・実績の対象期間',p.period||'2026年度・社内デモ',true)}${formField('plan','事業計画・工程の定義',p.plan||'',true,true)}<div class="clientfields">${formField('done','完了工程数',p.done??0,true)}${formField('total','総工程数',p.total??5,true)}</div>${landSelect('qualitative','定性的な進捗',['未着手','進行中','要対策','完了'].map(x=>[x,x]),p.qualitative)}${formField('evidence','進捗の根拠',p.evidence||'',true,true)}${['revenuePlan','revenueActual','profitPlan','profitActual'].map((k,j)=>formField(k,['計画売上（億円）','実績売上（億円）','計画営業利益（億円）','実績営業利益（億円）'][j],p[k]??'',true)).join('')}<h3>携わるメンバー</h3>${people.map(x=>`<label class="checkline"><input type="checkbox" name="member-${x.id}" ${p.members.includes(x.id)?'checked':''}> ${x.name}</label>`).join('')}<h3>取引先</h3>${clients.map((c,j)=>`<label class="checkline"><input type="checkbox" name="client-${j}" ${p.clientIds.includes(c.id)?'checked':''}> ${esc(c.name)} / ${esc(c.company)}</label>`).join('')}${formField('issue','現状の課題',p.issue||'',false,true)}${landSelect('helpTo','HELP先',['全事業部',...Object.keys(divisions)].map(x=>[x,x]),p.helpTo)}${formField('help','HELPしてほしい内容',p.help||'',false,true)}${landSelect('helpStatus','HELP状況',['募集中','対応中','解決','依頼なし'].map(x=>[x,x]),p.helpStatus)}${formField('deadline','期限',p.deadline||'',false,false,'date')}${landSelect('theme','中計との対応（デモ上の分類）',strategyThemes.map(x=>[x,x]),p.theme)}${formField('updated','確認日',p.updated||'',true,false,'date')}<div id="projecterror" role="alert"></div><button class="primary">保存</button></form>`);document.getElementById('projectform').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),n={id:p.id||'pj-'+Date.now()};['name','division','department','period','plan','qualitative','evidence','issue','helpTo','help','helpStatus','deadline','theme','updated'].forEach(k=>n[k]=String(f.get(k)||'').trim());['done','total','revenuePlan','revenueActual','profitPlan','profitActual'].forEach(k=>n[k]=String(f.get(k)||'').trim()===''?NaN:Number(f.get(k)));n.members=people.filter(x=>f.get('member-'+x.id)).map(x=>x.id);n.clientIds=clients.filter((c,j)=>f.get('client-'+j)).map(c=>c.id);const error=validateProject(n);if(error){document.getElementById('projecterror').textContent=error;return}const updated=[...projects];if(i<0)updated.push(n);else updated[i]=n;try{if(projectError)throw Error(projectError);localStorage.setItem('kasumi-projects-v1',JSON.stringify(updated))}catch{document.getElementById('projecterror').textContent='保存できませんでした。入力内容を保持しています。';return}projects=updated;modal.close();render();showProject(i<0?projects.length-1:i)}}
function validateProject(p){if(!p.name||!p.period||!p.plan||!p.evidence||!p.updated)return '企画名・対象期間・計画・根拠・確認日を入力してください。';if(!divisions[p.division]?.includes(p.department))return '選択した事業部に属する部署を選択してください。';if(!Number.isInteger(p.total)||p.total<=0||!Number.isInteger(p.done)||p.done<0||p.done>p.total)return '工程数は整数で、0 ≦ 完了数 ≦ 総工程数にしてください。';if(['revenuePlan','revenueActual','profitPlan','profitActual'].some(k=>!Number.isFinite(p[k]))||p.revenuePlan<0||p.revenueActual<0)return '売上・利益を数値で入力してください。売上は0以上です。';if(!p.members.length)return '少なくとも1名のメンバーを選択してください。';return ''}
function outputProjects(){const text=projectRows().map(p=>`【${p.division}事業部 / ${p.department}】${p.name}\n対象期間：${p.period} / 確認日：${p.updated}\n計画：${p.plan}\n達成度：${pct(p.done,p.total)}（${p.done}/${p.total}工程）\n定性：${p.qualitative} / 根拠：${p.evidence}\n売上：${p.revenueActual}/${p.revenuePlan}億円（${pct(p.revenueActual,p.revenuePlan)}）\n営業利益：${p.profitActual}/${p.profitPlan}億円（${pct(p.profitActual,p.profitPlan)}）\nメンバー：${p.members.map(clientName).join('、')}\n取引先：${p.clientIds.map(id=>clients.find(c=>c.id===id)?.name||'未登録').join('、')}\n課題：${p.issue}\nHELP → ${p.helpTo}：${p.help} / ${p.helpStatus} / 期限 ${p.deadline}`).join('\n\n');openModal(`<h1>課題・HELPの出力</h1><p>表示中の絞り込み条件に対応した架空デモの報告です。</p><textarea readonly style="width:100%;height:400px;padding:16px" aria-label="企画の進捗報告">${esc(text||'該当企画なし')}</textarea><p class="role">選択してコピーできます。送信は行いません。</p>`)}
const strategySource='https://www2.jpx.co.jp/disc/34980/140120260403598379.pdf';
function renderStrategy(){app.innerHTML+=`<div class="banner"><span>公式開示の参照スナップショット：2026年4月3日公表。最新決算への自動更新は行っていません。</span><a class="link" href="${strategySource}" target="_blank" rel="noopener">会社公表資料 ↗</a></div><div class="sectionhead"><h2>全社戦略 / 第2期中期経営計画</h2></div><p>2029年8月期の目標：当期純利益500億円、AUM 1.5兆円。収益機会の多層化・運用資産の拡大・事業領域の多角化を、社内企画の分類に対応させています（分類は本アプリの整理）。</p><p class="role">出典：同資料 p.57〜62。中計の最終目標と単年度予想は分けて表示します。</p><div class="stats">${metric('2025年8月期純利益 → 2029年中計目標',102.50,500)}${metric('2025年8月末AUM → 2029年中計目標',3941,15000)}</div><p class="notice">上記は基準実績の最終目標に対する比率であり、現在時点の達成率や進捗ペースの評価ではありません。</p><h2>全社の定量進捗 / 2026年8月期上期</h2><p class="role">上期実績 ÷ 通期予想。半期予算との比較ではありません。単位：億円。出典：同資料 p.5。</p><div class="stats">${metric('売上高',611.16,1500)}${metric('営業利益',80.65,265)}${metric('当期純利益',49.51,165)}</div><div class="panel"><h3>営業利益率</h3><p>上期実績 ${pct(80.65,611.16)} / 通期予想からの計算値 ${pct(265,1500)}<br>差分 ${(80.65/611.16*100-265/1500*100).toFixed(2)} ポイント</p><p class="role">利益率＝営業利益÷売上高。差分は達成率ではなくポイント差。中計の利益率目標として開示された値ではありません。</p></div><div class="sectionhead"><h2>事業部ごとの達成度 / 社内デモ</h2></div><p>以下は登録企画の架空計画・実績の集計です。公式セグメント業績・連結業績には合算しません。異なる対象期間は別集計します。</p>`;const periods=[...new Set(projects.map(p=>p.period))];for(const period of periods){app.innerHTML+=`<h3 style="margin:25px 0">対象期間：${esc(period)}</h3>`;for(const d of Object.keys(divisions)){const ps=projects.filter(p=>p.division===d&&p.period===period);if(!ps.length)continue;const sum=k=>ps.reduce((s,p)=>s+p[k],0);app.innerHTML+=`<div class="panel" style="margin-bottom:22px"><div class="sectionhead" style="margin-top:0"><h2>${d}事業部</h2><button class="link" onclick="projectDivision='${d}';projectDepartment='all';go('projects')">企画を確認 ↗</button></div><div class="stats">${metric('売上高',sum('revenueActual'),sum('revenuePlan'))}${metric('営業利益',sum('profitActual'),sum('profitPlan'))}</div><p>営業利益率：実績 ${pct(sum('profitActual'),sum('revenueActual'))} / 計画 ${pct(sum('profitPlan'),sum('revenuePlan'))}<br>工程達成度：${pct(sum('done'),sum('total'))}（${sum('done')}/${sum('total')}工程）</p>${progressBar(sum('done'),sum('total'))}<h3 style="margin-top:20px">定性的な進捗・課題</h3>${ps.map(p=>`<div class="row"><b>${esc(p.department)} / ${esc(p.qualitative)}</b><br>戦略との対応：${esc(p.theme)}<br>${esc(p.evidence)}<br>課題：${esc(p.issue)}<br>HELP → ${esc(p.helpTo)}：${esc(p.help)}（${esc(p.helpStatus)}）</div>`).join('')}</div>`}}app.innerHTML+=`<p class="notice">工程の進捗は各工程を等しい重みで集計。定性評価は登録者の報告で、自動推定ではありません。売上・利益の計画が0の場合は達成率を「—」とします。</p>`}
const showPersonProjects=showPerson;showPerson=function(id){showPersonProjects(id);const ps=projects.filter(p=>p.members.includes(id));modal.innerHTML+=`<h3 style="margin-top:25px">携わっている企画</h3>${ps.map(p=>`<p><button class="link" onclick="showProject(${projects.indexOf(p)})">${esc(p.name)} / ${esc(p.division)}・${esc(p.department)} ↗</button></p>`).join('')||'<p>未登録</p>'}`};
const showClientProjects=showClient;showClient=function(i){showClientProjects(i);const ps=projects.filter(p=>p.clientIds.includes(clients[i].id));modal.innerHTML+=`<h3 style="margin-top:25px">関連する進行中企画</h3>${ps.map(p=>`<p><button class="link" onclick="showProject(${projects.indexOf(p)})">${esc(p.name)} ↗</button></p>`).join('')||'<p>未登録</p>'}`};

render();
</script></body></html>
